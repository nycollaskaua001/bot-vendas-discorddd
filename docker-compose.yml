version: '3.8'

services:
  bot:
    build: .
    container_name: bot-vendas-discord
    environment:
      - DISCORD_TOKEN=${DISCORD_TOKEN}
      - GUILD_ID=${GUILD_ID}
      - LOG_CHANNEL_ID=${LOG_CHANNEL_ID}
      - OWNER_ID=${OWNER_ID}
      - PIX_KEY=${PIX_KEY}
      - RECEIVER_NAME=${RECEIVER_NAME}
      - BLOCKED_BANKS=${BLOCKED_BANKS}
    volumes:
      - ./data:/app/data
      - ./assets:/app/assets
    restart: unless-stopped
